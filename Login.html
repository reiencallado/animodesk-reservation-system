<!DOCTYPE html>
<html>
    <title> GreenLabs Login Page </title>
    <head>
        <link rel="stylesheet" href="loginstyle.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div class="login">
            <header class="greenlabshead">
                <div class="logocontainer">
                    <img src="AnimoDesk Logo White.jpg" alt="AnimoDesk Logo">
                    <h1>Let's get you started!</h1>
                </div>
                
            </header>
        <main class="logging">
            <form action="index.html" method="post">
                <p class="userlog"> Username </p>
                <p> <input type="text" id="username" name="user"/></p>
                <p class="userlog"> Password </p>
                <p> <input type="password" id="password" name="pass" /> </p>
                <p> <input type="submit" class="logsubmit" value="Login" /> 

                <!--Link to the register account-->
                <form action="index.html" method="post">
                <input type="submit" class="registration" value="Register"/>
                </form> 
                </p>
                 
            </form>
            
           
        </main>

        <aside class="welcome">
            <header class="welcomehead">
                <h1>Welcome to AnimoDesk!</h1>
            </header>
            <p class="welcomebody"> Need a laboratory? Or want to check up on other students using the labs? </p>
            <p class="welcomebody"> Just sign up using your DLSU email, and we'll get you started!</p>
            <p class="welcomebody"> Don't have an account? Just click the register button and we can get you started!</p>
            <div class="welcomeimg">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Contemporary_Computer_Lab.jpg/1920px-Contemporary_Computer_Lab.jpg" alt="Computer Lab Image">
            </div>
        </aside>


        </div>
    </body>
</html>
