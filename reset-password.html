<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

<style>

body{
background:#006f3c;
font-family:'Segoe UI',Roboto,Arial;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.reset-wrapper{
width:100%;
display:flex;
justify-content:center;
align-items:center;
}

.reset-card{
background:#004d2a;
padding:40px;
border-radius:10px;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
color:white;
text-align:center;
}

.reset-card h1{
margin-bottom:8px;
font-size:28px;
}

.reset-subtitle{
font-size:14px;
opacity:0.8;
margin-bottom:25px;
}

label{
display:block;
text-align:left;
font-size:14px;
margin-top:10px;
margin-bottom:5px;
}

input{
width:100%;
padding:12px;
border-radius:6px;
border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.1);
color:white;
font-size:14px;
}

button{
margin-top:20px;
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#0db14b;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#0aa043;
}

</style>
    <link rel="stylesheet" href="theme.css">

</head>

<body>
    <button id="themeToggle" class="theme-toggle fixed" type="button">Dark mode</button>

<div class="reset-wrapper">

    <div class="reset-card">
        <img src="images/AnimoDesk Logo Dark Green on White.png" width="80">
        <h1>Reset Password</h1>
        <p class="reset-subtitle">Enter your new password below</p>

        <form id="resetForm">

            <label>New Password</label>
            <input type="password" id="password" placeholder="Enter new password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit">Reset Password</button>

        </form>

    </div>

</div>

<script>

    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get("email");

    document.getElementById("resetForm").addEventListener("submit", async function(e) {

        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        const strongPassword =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

        if (!strongPassword.test(password)) {
            alert("Password must be at least 8 characters long with uppercase, lowercase, and number.");
            return;
        }

        try {

            const response = await fetch("/reset-password", {

                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })

            });

            const data = await response.json();

            if (data.success) {
                alert("Password successfully reset.");
                window.location.href = "Login.html";
            } else {
                alert(data.message);
            }

        } catch (error) {
            console.error(error);
            alert("Server error.");
        }

    });
</script>
    <script src="theme.js"></script>

    <footer class="footer py-3 text-center">
        <div class="container">
            <small class="text-muted">Policies: <a href="Privacy Policy.html">Privacy Policy</a> · <a href="Terms of Use.html">Terms of Use</a></small>
        </div>
    </footer>
</body>
</html>
